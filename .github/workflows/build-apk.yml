name: NFC Manager - APK telechargeable V4
run-name: NFC Manager APK V4 - ${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compiler puis publier l'APK
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Installer la plateforme Android necessaire
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Verifier le code source
        shell: bash
        run: |
          if [ ! -s MainActivity.java ]; then
            echo "ERREUR : MainActivity.java est absent de la racine du depot."
            exit 1
          fi
          echo "Source Java trouvee : $(wc -c < MainActivity.java) octets."

      - name: Creer le projet Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/nfccardreader
          mkdir -p app/src/main/res/values app/src/main/res/drawable
          cp MainActivity.java app/src/main/java/com/example/nfccardreader/MainActivity.java

          cat > settings.gradle <<'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NFC-Manager"
          include(":app")
          SETTINGS

          cat > build.gradle <<'BUILD'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          BUILD

          cat > app/build.gradle <<'APP'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.nfccardreader'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.nfccardreader'
                  minSdk 21
                  targetSdk 28
                  versionCode 7
