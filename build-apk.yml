name: Build NFC Card Reader APK
on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/nfccardreader app/src/main/res/values
          cp MainActivity.java app/src/main/java/com/example/nfccardreader/MainActivity.java
          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='NFC-Card-Reader'
          include ':app'
          GRADLE
          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          GRADLE
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android { namespace 'com.example.nfccardreader'; compileSdk 35
            defaultConfig { applicationId 'com.example.nfccardreader'; minSdk 21; targetSdk 28; versionCode 3; versionName '1.2' }
          }
          GRADLE
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.NFC"/>
            <uses-feature android:name="android.hardware.nfc" android:required="false"/>
            <application android:theme="@style/AppTheme" android:label="NFC Card Reader" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          XML
          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#1565C0</item></style></resources>
          XML
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NFC-Card-Reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
